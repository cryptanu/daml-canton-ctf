_shared.storage {
  type = postgres
  config {
    dataSourceClassName = "org.postgresql.ds.PGSimpleDataSource"
    properties {
      serverName = postgres
      portNumber = 5432
      user = canton
      password = ${POSTGRES_PASSWORD}
    }
  }
}
canton {
  participants.sandbox {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = participant
    http-ledger-api.address = "0.0.0.0"
  }
  mediators.mediator1 {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = mediator
  }
  sequencers.sequencer1 {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = sequencer
    sequencer.config.storage = ${_shared.storage}
    sequencer.config.storage.config.properties.databaseName = sequencer_driver
  }
}
