// Two participants + one sequencer + one mediator in one JVM, all on Postgres.
// participant1 hosts the issuer (backend); participant2 hosts the players (gateway).
_shared.storage {
  type = postgres
  config {
    dataSourceClassName = "org.postgresql.ds.PGSimpleDataSource"
    properties {
      serverName = ${POSTGRES_HOST}
      portNumber = ${POSTGRES_PORT}
      user = ${POSTGRES_USER}
      password = ${POSTGRES_PASSWORD}
    }
  }
}
canton {
  parameters.non-standard-config = yes
  sequencers.sequencer1 {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = sequencer
    public-api { address = "0.0.0.0", port = 5001 }
    admin-api  { address = "127.0.0.1", port = 5002 }
    sequencer {
      type = reference
      config.storage = ${_shared.storage}
      config.storage.config.properties.databaseName = sequencer_driver
    }
  }
  mediators.mediator1 {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = mediator
    admin-api { address = "127.0.0.1", port = 5202 }
  }
  participants.participant1 {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = participant1
    ledger-api     { address = "127.0.0.1", port = 5011 }
    admin-api      { address = "127.0.0.1", port = 5012 }
    http-ledger-api { address = "0.0.0.0",  port = 7575 }
  }
  participants.participant2 {
    storage = ${_shared.storage}
    storage.config.properties.databaseName = participant2
    ledger-api     { address = "127.0.0.1", port = 5021 }
    admin-api      { address = "127.0.0.1", port = 5022 }
    http-ledger-api { address = "0.0.0.0",  port = 7576 }
  }
}
